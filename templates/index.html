<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Heart Disease Prediction System</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{

            background:linear-gradient(135deg,#FFF8F5,#F9FCFF,#EEF7FF);

            min-height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            padding:40px;

        }

        .container{

            width:900px;

            background:#ffffff;

            border-radius:20px;

            padding:40px;

            box-shadow:0 12px 30px rgba(0,0,0,0.12);

        }

        h1{

            text-align:center;

            color:#4A6FA5;

            font-size:40px;

            margin-bottom:10px;

        }

        .subtitle{

            text-align:center;

            color:#666;

            margin-bottom:35px;

            font-size:17px;

        }

        form{

            display:grid;

            grid-template-columns:1fr 1fr;

            gap:20px;

        }

        .input-group{

            display:flex;

            flex-direction:column;

        }

        label{

            font-weight:bold;

            margin-bottom:8px;

            color:#444;

        }

        input{

            padding:12px;

            border:1px solid #D8E2F0;

            border-radius:10px;

            background:#FAFCFF;

            font-size:15px;

            transition:0.3s;

        }

        input:focus{

            outline:none;

            border-color:#8FB8DE;

            background:white;

            box-shadow:0 0 8px rgba(143,184,222,.35);

        }

        .button{

            grid-column:1/3;

            margin-top:15px;

        }

        button{

            width:100%;

            padding:15px;

            border:none;

            border-radius:10px;

            font-size:20px;

            background:linear-gradient(to right,#A8D8EA,#7FB3D5);

            color:white;

            cursor:pointer;

            transition:0.3s;

        }

        button:hover{

            transform:translateY(-2px);

            box-shadow:0 8px 18px rgba(127,179,213,.35);

        }

        .result{

            margin-top:30px;

            padding:20px;

            border-radius:12px;

            background:#EDF9F1;

            border-left:6px solid #8BCFA7;

            color:#2E7D32;

            text-align:center;

            font-size:24px;

            font-weight:bold;

        }

        .footer{

            margin-top:30px;

            text-align:center;

            color:#777;

            font-size:14px;

        }

        @media(max-width:850px){

            form{

                grid-template-columns:1fr;

            }

            .button{

                grid-column:1;

            }

            .container{

                width:100%;

                padding:25px;

            }

        }

    </style>

</head>

<body>

<div class="container">

    <h1>❤️ Heart Disease Prediction</h1>

    <p class="subtitle">
        Enter the patient's health details to predict the likelihood of heart disease.
    </p>

    <form action="/predict" method="POST">

        <div class="input-group">
            <label>Age</label>
            <input type="number" name="age" placeholder="Enter Age" required>
        </div>

        <div class="input-group">
            <label>Sex (1 = Male, 0 = Female)</label>
            <input type="number" name="sex" placeholder="0 or 1" required>
        </div>

        <div class="input-group">
            <label>Chest Pain Type</label>
            <input type="number" name="chest_pain_type" placeholder="0 - 3" required>
        </div>

        <div class="input-group">
            <label>Blood Pressure</label>
            <input type="number" name="BP" placeholder="120" required>
        </div>

        <div class="input-group">
            <label>Cholesterol</label>
            <input type="number" name="cholesterol" placeholder="200" required>
        </div>

        <div class="input-group">
            <label>FBS Over 120</label>
            <input type="number" name="FBS_over_120" placeholder="0 or 1" required>
        </div>

        <div class="input-group">
            <label>EKG Results</label>
            <input type="number" name="EKG_results" placeholder="0 - 2" required>
        </div>

        <div class="input-group">
            <label>Maximum Heart Rate</label>
            <input type="number" name="max_HR" placeholder="150" required>
        </div>

        <div class="input-group">
            <label>Exercise Induced Angina</label>
            <input type="number" name="exercise_angina" placeholder="0 or 1" required>
        </div>

        <div class="input-group">
            <label>ST Depression</label>
            <input type="number" step="0.1" name="ST_depression" placeholder="1.5" required>
        </div>

        <div class="input-group">
            <label>Slope of ST Segment</label>
            <input type="number" name="slope_of_ST" placeholder="1 - 3" required>
        </div>

        <div class="input-group">
            <label>Number of Major Vessels</label>
            <input type="number" name="number_of_vessels_fluro" placeholder="0 - 3" required>
        </div>

        <div class="input-group" style="grid-column:1/3;">
            <label>Thallium Test Result</label>
            <input type="number" name="thallium" placeholder="3, 6 or 7" required>
        </div>

        <div class="button">

            <button type="submit">

                ❤️ Predict Heart Disease

            </button>

        </div>

    </form>

    {% if prediction %}

    <div class="result">

        Prediction Result

        <br><br>

        {{ prediction }}

    </div>

    {% endif %}

    <div class="footer">

        Developed with ❤️ using Python, Flask and Machine Learning

    </div>

</div>

</body>

</html>
